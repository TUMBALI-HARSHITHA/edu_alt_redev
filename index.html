    <!-- Static Pre-mount Loader -->

      #edu-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
    </style>
    <!-- Remove any previously stored dark theme preference -->
    <script>localStorage.removeItem('theme'); document.documentElement.classList.remove('dark');</script>
</head>
<body class="text-slate-900 transition-colors duration-300">

    <!-- Page loader -->
    <div id="edu-loader"></div>

    <div id="root"></div>
    <script type="module" src="/index.jsx"></script>
    <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Remove loader once React mounts -->
    <script>
      (function(){
        var root=document.getElementById('root');
        var loader=document.getElementById('edu-loader');
        if(!root||!loader)return;
        var ob=new MutationObserver(function(){
          if(root.children.length>0){
            loader.style.opacity='0';
            loader.style.transition='opacity 0.4s ease';
            setTimeout(function(){loader.remove();},400);
            ob.disconnect();
          }
        });
        ob.observe(root,{childList:true});
      })();
    </script>
</body>
